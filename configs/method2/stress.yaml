# Stress test — scaling theo số lượng tool (§Phase 7, §10.2 experimental_plan)
#
# Điểm cần chứng minh: latency của Method 2 gần như PHẲNG theo N, trong khi SLM
# và API tăng tuyến tính (context dài ra). Bi-Encoder chỉ tốn thêm một phép nhân
# ma trận 1×d · d×N; Cross-Encoder không đổi vì chỉ chạy trên tool đã chọn.

n_values: [3, 10, 50, 100, 500, 1000]

# random      = distractor lấy ngẫu nhiên từ tool pool
# same_domain = distractor cùng feature_group với gold (khó hơn)
distractor_modes: [random, same_domain]

n_queries: 200            # 6 N × 2 mode × 200 = 2,400 instance
seed: 42

# Distractor lấy từ tool pool ~4,4k tool THẬT, không sinh giả.
tool_pool_path: data/method2/tool_pool.json
gold_path: data/custom_vi/v1/test_seen.jsonl

output_dir: results/method2/stress

# Ghi chú: same_domain chỉ có ý nghĩa với tool đã được gán feature_group thật.
# Hiện chỉ 40 tool CustomTools-VI có nhãn; glaive/xLAM đang là "Khác" cho tới
# khi chạy được src/data/feature_group_classify.py (cần API key).
