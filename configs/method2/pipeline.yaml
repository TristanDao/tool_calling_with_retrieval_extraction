# Pipeline Method 2 = Bi-Encoder → Cross-Encoder → Validator (§Phase 5)
# Xuất predictions.jsonl theo prediction contract của docs/evaluation.md §3.

models:
  # run02 = Round 2 (mine hard negative + train lại từ base). run01 chỉ là máy
  # đào negative, KHÔNG phải model cuối — trỏ nhầm vào run01 là đánh giá bằng
  # checkpoint yếu hơn hẳn (pool-scope ndcg@10 0.715 so với 0.752).
  biencoder: artifacts/method2/biencoder/run02/final
  crossencoder: artifacts/method2/crossencoder/run01/final
  # Ngưỡng đã hiệu chỉnh trên val và FREEZE — không được tune lại trên test.
  thresholds: artifacts/method2/biencoder/run02/thresholds.json
  max_seq_length: 192

index:
  embeddings_path: data/method2/index/tool_embeddings.npy
  tool_ids_path: data/method2/index/tool_ids.json
  tool_pool_path: data/method2/tool_pool.json

# candidates = xếp hạng trong candidate pool của từng sample (thiết lập benchmark)
# pool       = xếp hạng trên toàn bộ ~4,4k tool (thiết lập stress test)
retrieval_scope: candidates

# Cơ chế abstention (ablation §6.1):
#   tau         = ngưỡng cosine top-1 của Bi-Encoder (§5.1) — BASELINE
#   should_call = head nhị phân của Cross-Encoder trên (query, tool top-1)
# `should_call` đòi checkpoint có head đó; không có thì pipeline DỪNG chứ không
# lặng lẽ quay về tau — quay lặng lẽ là báo cáo số baseline dưới tên ablation.
abstention: tau
# Hiệu chỉnh trên val bằng scripts/method2/calibrate_should_call.py rồi FREEZE,
# đúng như τ. 0.5 chỉ là mặc định để chạy được vòng val đầu tiên.
should_call_threshold: 0.5

extraction:
  max_length: 256
  has_value_threshold: 0.5
  fallback_has_value_threshold: 0.3
  max_answer_len: 30
  batch_size: 64
  # PHẢI khớp `model.max_question_tokens` của crossencoder.yaml. Lệch nhau là
  # train/serve skew: model học trên question đã cắt, chạy thật trên bản đầy đủ.
  max_question_tokens: 96
  use_normalizer: true          # ablation §6.2
  normalizer:
    reference_date: null        # ISO date, vd 2026-08-23
    century: 2000

output:
  dir: results/method2/predictions
  # Hai chế độ bắt buộc §6.3 experimental_plan:
  #   pipeline → predictions.jsonl
  #   oracle   → oracle_predictions.jsonl
  modes: [pipeline, oracle]

# Lệnh đánh giá sau khi có predictions (chạy bằng evaluator chung):
#   python -m src.evaluation.cli evaluate \
#     --gold data/benchmark_vi/test.jsonl \
#     --predictions results/method2/predictions/predictions.jsonl \
#     --oracle-predictions results/method2/predictions/oracle_predictions.jsonl \
#     --slice metadata.tool_split \
#     --output-dir results/evaluation/method_2
