# Cross-Encoder — Schema-aware Parameter Extraction (§Phase 3, method2_plan)
# Backbone xlm-roberta-base (278M): full fine-tune vừa T4 với batch 32 @ len 256.
# BGE-M3 (568M) cùng setting → ~17.5GB → OOM, chỉ chạy 1 run so sánh ở §Phase 6.

# ---------------------------------------------------------------- data pairs
pairs:
  output_dir: data/method2/crossencoder
  stats_path: data/method2/label_stats.json
  skip_rate_gate: 0.30       # §1.5: vượt ngưỡng → xem lại Q2 (fuzzy alignment)
  require_boolean_cue: false # true = bỏ sample boolean mà query không có manh mối
  limit_per_source: null

  # ---- Ablation §6.1: head `should_call` thay ngưỡng cosine τ --------------
  # Sinh thêm hàng cấp TOOL (query, tool) với nhãn nhị phân, nằm chung file với
  # hàng cấp parameter. PHẢI bật cùng `model.enable_should_call` — bật một bên
  # là có nhãn mà không có head, hoặc có head mà không có gì dạy nó.
  #
  # Bật cờ này làm ĐỔI nội dung pair, mà `crossencoder/train.jsonl` bị preflight
  # khoá SHA-256. ĐỪNG ghi đè nó: đổi luôn ba đường dẫn dưới đây sang thư mục
  # riêng thì artefact gốc còn nguyên, manifest không đổi, preflight vẫn pass và
  # baseline chạy lại được — cùng nguyên tắc mà ablation Bi-Encoder dùng (§7.16 D).
  #
  #   pairs.output_dir : data/method2/crossencoder_should_call
  #   data.train_path  : data/method2/crossencoder_should_call/train.jsonl
  #   data.val_path    : data/method2/crossencoder_should_call/val.jsonl
  #
  # Sinh pair phải chạy ở LOCAL (`benchmark_vi/train.jsonl` không nằm trong
  # dataset upload), rồi bump version dataset data hiện có — không cần dataset mới.
  should_call:
    enabled: false
    tools_per_negative: 1     # train chỉ có ~2,11 candidate/sample no-call
    positive_rate: 0.5        # 59.130 positive vs 16.199 no-call → phải cân
    seed: 42

# -------------------------------------------------------------------- model
model:
  name: xlm-roberta-base
  # Fallback: intfloat/multilingual-e5-base | so sánh: BAAI/bge-m3
  max_enum_size: 20          # enum lớn nhất đo được = 12
  # `truncation="only_first"` chỉ cắt query, nên question dài hơn max_length làm
  # tokenizer ném "Sequence to truncate too short". Đo thật: p99 = 66 token,
  # dài nhất 461 token (param `country` của xLAM, description 883 ký tự).
  # PHẢI khớp `extraction.max_question_tokens` của pipeline.yaml.
  max_question_tokens: 96
  dropout: 0.1
  # Ablation §6.1. False = state dict trùng khít checkpoint run01.
  enable_should_call: false

# ---------------------------------------------------------------- tokenizer
data:
  train_path: data/method2/crossencoder/train.jsonl
  val_path: data/method2/crossencoder/val.jsonl
  max_length: 256            # KHÔNG dùng 1024 (§2.3b)
  padding: longest           # KHÔNG dùng max_length
  num_workers: 2

# ------------------------------------------------------------------ training
train:
  output_dir: artifacts/method2/crossencoder/run01
  batch_size: 32
  grad_accum: 2              # effective 64
  eval_batch_size: 16        # eval batch = 1/2 train batch, tránh OOM cuối job
  epochs: 3
  lr: 3.0e-5
  head_lr: 1.0e-4            # head mới, lr cao hơn encoder
  warmup_ratio: 0.06
  weight_decay: 0.01
  max_grad_norm: 1.0
  fp16: true
  gradient_checkpointing: false
  logging_steps: 50
  eval_steps: 500
  save_steps: 500            # Kaggle có thể ngắt bất ngờ
  save_total_limit: 2
  seed: 42
  resume_from: null

# Curriculum §Phase 3: warm-up trên glaive+xLAM rồi fine-tune trên custom_vi.
curriculum:
  enabled: true
  stages:
    - name: warmup
      sources: [glaive, xlam]
      epochs: 2
      lr: 3.0e-5
    - name: finetune
      sources: [custom_vi]
      epochs: 2
      lr: 1.0e-5

loss:
  has_value_weight: 1.0
  span_weight: 1.0
  enum_weight: 1.0
  boolean_weight: 1.0
  # Chỉ có tác dụng khi head được bật; hàng cấp tool không đi vào head khác.
  should_call_weight: 1.0
  span_loss_combiner: sum

# ----------------------------------------------------------------- inference
inference:
  has_value_threshold: 0.5
  fallback_has_value_threshold: 0.3   # dùng khi validator thấy thiếu required
  max_answer_len: 30
  batch_size: 64
  use_normalizer: true                # ablation §6.2: false = tắt normalizer
  normalizer:
    reference_date: null              # ISO date; null = bỏ qua ngày tương đối
    century: 2000

# Gate để qua Phase 4 (chế độ oracle retrieval), đo trên custom val.
gates:
  has_value_f1: 0.90
  span_em: 0.80
  enum_accuracy: 0.90
  boolean_accuracy: 0.85
  argument_em: 0.70
