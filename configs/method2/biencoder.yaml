# Bi-Encoder — Semantic Tool Retrieval (§Phase 2, method2_plan)
# Ngân sách VRAM tính cho Kaggle T4 16GB, fp16 (T4 không có bf16).

# ---------------------------------------------------------------- data pairs
pairs:
  tool_pool_path: data/method2/tool_pool.json
  output_dir: data/method2/biencoder
  stats_path: data/method2/biencoder/pairs_stats.json
  # Trả về đúng plan §Phase 1.3 sau khi Run 1 (n_neg=2) đã xong: mỗi sample
  # encode 6 văn bản thay vì 4, +50% compute nhưng MNRL mạnh lên theo số
  # negative. Dữ liệu trên đĩa vốn đã có sẵn 4 negative/dòng.
  n_hard_negatives: 4        # = plan; ablation §6.4: 0 / 2 / 4 / 8
  bm25_top_k: 20
  use_bm25: true
  seed: 42
  limit_per_source: null

# -------------------------------------------------------------------- model
model:
  name: BAAI/bge-m3
  max_seq_length: 192
  # Fallback nếu không đạt gate §Phase 2: AITeamVN/Vietnamese_Embedding
  lora:
    enabled: true
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: [query, key, value, dense]

# ------------------------------------------------------------------ training
train:
  train_path: data/method2/biencoder/train.jsonl
  val_path: data/method2/biencoder/val.jsonl
  # run02 = Round 2 (plan §Phase 2 bước 3). Round 1 nằm ở run01 và chỉ còn vai
  # trò máy đào negative — `mine` PHẢI được truyền `--model .../run01/final`.
  output_dir: artifacts/method2/biencoder/run02
  loss: CachedMultipleNegativesRankingLoss   # GradCache, không phải grad accum
  scale: 20.0                # = 1/τ, mặc định sentence-transformers
  # Cấu hình case E của benchmark (xem docs/method2.md §7.7): 36.4 s/step ở
  # n_neg=4, còn ~24.3 ở n_neg=2. mini_batch 8 khiến GPU chạy không tải —
  # GradCache gọi model 384 lần/step, mỗi lần chỉ 8x192 token.
  batch_size: 256            # effective, nhờ GradCache — GIỮ NGUYÊN, quyết định chất lượng
  mini_batch_size: 32        # thực tế đưa vào GPU
  epochs: 3                  # = plan. 307 step/epoch x 3 = 921 step ~ 9.7 h
  lr: 2.0e-5
  warmup_ratio: 0.1
  scheduler: cosine
  fp16: true
  # Tắt: benchmark cho 36.4 s/step thay vì 47.7, đổi lại peak 10.9 GB / 14.6.
  # OOM thì bật lại true rồi resume từ checkpoint gần nhất.
  gradient_checkpointing: false
  eval_steps: 300
  # 500 quá thưa cho run ~614 step: OOM hay đứt session là mất gần hết.
  save_steps: 100
  seed: 42
  resume_from: null
  # Tên metric đã xác minh bằng cách chạy thật trên sentence-transformers
  # 6.0.0 (xem docs/method2.md §7). Giữ null cho Run 1 và Run 2 — hiện chỉ
  # BÁO CÁO chứ chưa nạp lại checkpoint tốt nhất. Khai tên dưới đây và bật
  # load_best_model_at_end cho các run chính/multi-seed:
  #   eval_custom_val_cosine_ndcg@10
  #   eval_custom_val_cosine_recall@5
  #   eval_custom_val_cosine_accuracy@1
  #   eval_custom_val_cosine_mrr@10
  metric_for_best_model: null
  # logging_steps nhỏ ở smoke run để thấy loss; preset tự đặt max(steps//10, 1).
  logging_steps: 50

# --------------------------------------------------------- hard negative mining
mining:
  # BẬT. Plan §Phase 2 liệt kê mine + Round 2 là bước 2-3 bắt buộc, không phải
  # tuỳ chọn. Chạy được trong 11 h vì Round 1 đã xong ở session trước và Round 2
  # train LẠI TỪ BASE — Round 1 chỉ cần đủ tốt để xếp hạng negative.
  enabled: true              # round 2 sau khi có checkpoint round 1
  top_k: 20
  skip_top: 1                # bỏ top-1 để tránh false negative
  n_negatives: 4
  output_path: data/method2/biencoder/train_mined.jsonl

# ------------------------------------------------------------------- index
index:
  embeddings_path: data/method2/index/tool_embeddings.npy
  tool_ids_path: data/method2/index/tool_ids.json
  batch_size: 64
  normalize: true

# --------------------------------------------------------------- thresholds
# Hiệu chỉnh trên validation rồi FREEZE trước khi chạy test (§5.1).
thresholds:
  output_path: artifacts/method2/biencoder/run02/thresholds.json
  # Abstention: max sim < tau → <no_tool_call>
  tau_grid: {start: 0.0, stop: 1.0, step: 0.01}
  # Multi-call: chọn mọi tool có sim >= tau_call, tối đa k_max
  tau_call_grid: {start: 0.0, stop: 1.0, step: 0.01}
  k_max: 3
  # Ablation Q4: gap-based thay cho ngưỡng tuyệt đối
  gap_delta_grid: {start: 0.0, stop: 0.3, step: 0.01}
  # "auto" = tu chon chien luoc thang calibration (so theo F1, xem `winner`
  # trong thresholds.json). Hardcode "absolute"/"gap" tung khien file chot
  # ghi "absolute" du calibration da tu chon "gap" tot hon - Phase 5 chay
  # bang chien luoc thua ma khong ai biet, vi `calibrate_thresholds()` chi
  # doc `selection["winner"]` khi gia tri dung bang "auto".
  strategy: auto               # auto | absolute | gap

# ------------------------------------------------------------------ evaluate
evaluate:
  k_values: [1, 3, 5, 10]
  output_dir: results/method2/metrics
