defaults:
  - _self_

input: data/normalized_en/glaive_normalized.jsonl
output: data/translations/glaive_normalized_vi.jsonl
failed_output: data/translations/failed/glaive_normalized_failed.jsonl
checkpoint: data/translations/.checkpoint/glaive_normalized.json
log_file: data/translations/logs/translate_glaive_normalized.log

dataset: glaive_normalized

start_index: 0
end_index: null

batch_size: 10
concurrency: 12
max_retries: 3
retry_initial_delay: 1.0
retry_backoff: 2.0
stop_after_consecutive_failures: 5

api:
  base_url: ${ALIBABA_URL}
  api_key: ${ALIBABA_API_KEY}
  model: ${ALIBABA_MODEL}
  backup_models: ${ALIBABA_BACKUP_MODELS}
  temperature: 0.1
  timeout: 60.0
  max_tokens: 8192

progress_log_every_n_batches: 5

feature_group:
  enabled: false
  config_path: configs/data/feature_group.yaml
