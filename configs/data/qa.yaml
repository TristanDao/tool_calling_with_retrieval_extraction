defaults:
  - _self_

input: data/translations/glaive_vi.jsonl
output: data/translations/qa_samples/glaive_qa.jsonl
report: data/translations/qa_samples/glaive_qa_report.json
source_input: data/raw/glaive_raw.jsonl
failed_input: data/translations/failed/glaive_failed.jsonl

dataset: glaive

rule_check:
  enabled: true
  require_keys:
    glaive: [system, chat]
    xlam: [id, query, answers, tools]
  identifier_pattern: "^[a-z][a-z0-9_]*$"

llm_judge:
  enabled: true
  sample_rate: 0.05
  base_url: https://ws-v9y2oinbtzzm4ey9.ap-southeast-1.maas.aliyuncs.com/compatible-mode/v1
  api_key: ${ALIBABA_API_KEY}
  model: qwen3.7-max
  temperature: 0.0
  max_tokens: 1024
  concurrency: 10

fail_on_rule_violation: false
