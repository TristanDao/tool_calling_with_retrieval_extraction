defaults:
  - _self_

input: data/translations/xlam_normalized_vi.jsonl
output: data/translations/qa_samples/xlam_normalized_qa.jsonl
report: data/translations/qa_samples/xlam_normalized_qa_report.json
source_input: data/normalized_en/xlam_normalized.jsonl
failed_input: data/translations/failed/xlam_normalized_failed.jsonl

dataset: xlam_normalized

rule_check:
  enabled: true
  require_keys:
    xlam_normalized: [id, source, query, function_calls, tools, has_tool_call]
  identifier_pattern: "^[a-z][a-z0-9_]*$"

llm_judge:
  enabled: true
  sample_rate: 0.05
  base_url: ${ALIBABA_URL}
  api_key: ${ALIBABA_API_KEY}
  model: qwen3.7-max
  temperature: 0.0
  max_tokens: 1024
  concurrency: 10

fail_on_rule_violation: false
