[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tool-calling-vi"
version = "0.1.0"
description = "Vietnamese Tool Calling via Semantic Retrieval + Schema-aware Parameter Extraction"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Thinh" }]
keywords = ["tool-calling", "function-calling", "vietnamese", "nlp", "llm", "agent"]

dependencies = [
    "torch>=2.1",
    "transformers>=4.40",
    "flagembedding>=1.2",
    "openai>=1.0",
    "hydra-core>=1.3",
    "datasets>=2.18",
    "jsonschema>=4.21",
    "pydantic>=2.5",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-cov",
    "matplotlib>=3.7",
    "ruff",
    "mypy",
    "black",
    "isort",
    "ipython",
    "jupyter",
]

[tool.setuptools.packages.find]
where = ["src"]
include = ["src*"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.10"
strict = false
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
pythonpath = ["."]
addopts = "-ra -q"
